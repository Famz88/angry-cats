name: Angry Cats mobile builds
on:
  push:
    branches: [main, 'codex/mobile-*']
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: mobile/android
      - run: python3 mobile/tests/apk_assets.py mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Angry-Cats-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Angry-Cats-Android-Lint
          path: mobile/android/app/build/reports/lint-results-debug.*
  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Angry-Cats-Android-APK
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 2048 -cores 2
          script: bash mobile/tests/android-smoke.sh artifacts/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Angry-Cats-Android-Emulator
          path: mobile/test-results/android/
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: mobile/ios
      - run: xcodebuild -project AngryCats.xcodeproj -scheme AngryCats -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios
      - run: tar -czf AngryCats-Simulator.tar.gz -C build/Build/Products/Debug-iphonesimulator AngryCats.app
        working-directory: mobile/ios
      - uses: actions/upload-artifact@v4
        with:
          name: Angry-Cats-iOS-Simulator
          path: mobile/ios/AngryCats-Simulator.tar.gz
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: |
          python3 -m http.server 4173 --directory www &
          npm run test:logic
          npm test
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Angry-Cats-Gameplay-Screenshots
          path: mobile/test-results/
